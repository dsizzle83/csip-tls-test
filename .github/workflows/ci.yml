name: CI

# TASK-003: build every sim/dashboard binary, run the fast unit suites, the
# southbound suites, the QA-harness unit gate, and the certify referee live
# set (cmd/certify + cmd/gw-campaign's own oracles/evidence/campaign engine —
# see WP7-T1 below) on every PR and push to main.
#
# Three non-scheduled jobs, split on the verified cgo boundary (grep -rl
# 'internal/wolfssl' --include='*.go' .; grep -rl 'internal/tlsclient'
# --include='*.go' .):
#   - pure-go:  everything that is CGO_ENABLED=0 clean. Builds and vets the
#               whole module (WP7-T10 landed the internal/wolfssl nocgo stub
#               that makes `go build/vet ./...` succeed without cgo — see that
#               step for detail) and runs the southbound and QA-harness
#               unit-gate suites.
#   - cgo-fast: caches a wolfSSL 5.7.6-stable build (identical recipe to
#               TASK-002 / sim_gridsim.txt Step 1), then runs `make
#               test-fast` (needs the cgo sysroot even though the TLS
#               handshake tests inside it are integration-tagged, because
#               internal/tlsclient itself is a cgo package), `make
#               test-certify` + a -race pass over internal/tlsprobe and
#               internal/mbtls (WP7-T1: the cgo half of the certify referee
#               live set), and builds the three cgo binaries (sim/server,
#               sim/client, sim/conformance).
#   - referee:  WP7-T1 (REV0907-E1/H8/E10): the CGO_ENABLED=0 half of the
#               certify referee live set — internal/certify/...,
#               internal/evidence/..., internal/invariant and cmd/certify/...
#               — proving cmd/certify stays usable with no TLS stack present.
#               Before this task, hosted CI never ran any of these four
#               package trees (the 130k-LOC oracle suites, the evidence
#               bundle verifier, the ten-invariant predicates, or the
#               conformance tool's own CLI) at all — see the CERTIFY_LIVE_SET
#               comment in the Makefile for the full background and
#               `make live-set-check` for the drift gate that keeps this
#               job's coverage honest as imports change.
#
# Explicitly OUT of scope for hosted CI (bench-touching / hardware-in-the-
# loop): `make test-integration` (real mTLS handshakes), `scripts/run-
# conformance.sh`, `make qa-bench`, `scripts/mayhem.py --dashboard ...`, and
# anything addressing 69.0.0.x. If bench-in-the-loop CI is ever wanted, the
# designated home is a self-hosted runner labelled [self-hosted, desktop]
# (the desktop already carries the wolfSSL sysroot at ~/.local/wolfssl-amd64
# and LAN access to the Pis) — not a hosted runner.
#
# cmd/hub (the obsolete monolith) and its forked orchestrator/bridge were
# deleted in TASK-010; the hub build lives in ~/projects/lexa-hub.
#
# TASK-005: `vulncheck` job runs a pinned govulncheck (scripts/ci/govulncheck.sh)
# on every PR/push AND nightly (new CVEs land without a code change). It reuses
# the cgo-fast job's wolfSSL cache/build steps — govulncheck needs the whole
# module to *build* (cgo packages included) or it silently scans less than you
# think. Required (blocking) as of TASK-006: the dependency refresh
# (x/crypto, x/net, x/sys) cleared this repo's baseline to 0 Called and 0
# informational findings — see docs/refactor/VULN_BASELINE_2026-07-04.md and
# its TASK-006 addendum.
#
# TASK-024: `proto-pin` job replaces TASK-004's report-only `lockstep` job
# (byte-diffing internal/southbound/sunspec and internal/ocppserver against
# lexa-hub). Both trees are now gone from both repos — TASK-020-023 moved
# them into the shared `lexa-proto` module (sunspec, derbase, modbus,
# ocppserver, csipmodel; AD-003) — so a tree-diff would compare nothing and
# be green by vacuity. The real MTR-4 lockstep question now is version skew:
# do the two consumer repos require the SAME lexa-proto commit? `proto-pin`
# compares each repo's committed `proto.pin` (the interim pinning mechanism,
# AD-003(c) — lexa-proto isn't hosted yet, so a go.mod pseudo-version
# comparison isn't possible) and fails on mismatch. See
# scripts/check-proto-pin.sh for the full mechanics (including the
# desktop-only `--verify-vendor` deep check).
#
# The two repos are both private under the same owner, so the default
# GITHUB_TOKEN cannot read lexa-hub for the second checkout — this job uses
# a fine-grained PAT stored as repo secret LEXA_HUB_RO_TOKEN (same secret
# TASK-004's lockstep job used):
#   Scope: read-only, "Contents" permission, restricted to the single repo
#   dsizzle83/lexa-hub. No other repos, no other permissions.
#   Expiry: set at creation (GitHub fine-grained PATs require an expiry);
#   rotate before it lapses or this job starts failing on checkout, not on
#   an actual pin mismatch — check the failure message before assuming drift.
#
# lexa-hub's CI runs the mirror-image job (checks out csip-tls-test via a new
# CSIP_TLS_TEST_RO_TOKEN secret, invokes the checked-out copy of this same
# script) — TASK-004's lockstep job was one-sided (only csip-tls-test's CI
# ran it), which is exactly the "asymmetric bump" gap TASK-024 closes; both
# repos must gate on the pin now.
#
# Enforcing (not report-only): any pin mismatch fails the job. There is no
# allowlist — a lockstep gate that ships known-differences-forever is the
# W3 failure mode repeating; the two repos are either pinned identically or
# the gate is red.
#
# WS-7 (docs/refactor/HANDOFF.md §8): three process gates added on top of the
# above.
#   - `pure-go` gains a `gofmt -l` step (tracked, non-vendor .go files must
#     already be formatted — vendor/ is committed third-party source plus the
#     AD-003(e) vendor/lexa-proto/ mirror, neither ours to reformat; see that
#     step for why reformatting vendor/lexa-proto specifically would fight
#     the new proto-pin --verify-vendor check below) and `-race` on its four
#     `go test` steps (this job had none; cmd/dashboard is concurrency-heavy
#     — lexa-hub's `test-nocgo` already runs -race, this repo didn't).
#     `-race` needs CGO_ENABLED=1 (a plain C compiler, not the wolfSSL
#     sysroot — ubuntu-latest ships gcc), so those four steps override the
#     job-level CGO_ENABLED=0 locally; the build/vet steps above them stay
#     CGO_ENABLED=0 to keep proving the pure-Go build is actually pure.
#   - `cgo-fast` gains a golangci-lint step (basic/default preset — no
#     .golangci.yml, so just errcheck/govet/ineffassign/staticcheck/unused —
#     pinned golangci-lint v2.12.2 via the pinned golangci-lint-action, reusing
#     this job's already-built wolfSSL sysroot so the whole module lints
#     cleanly including the cgo packages). `only-new-issues: true`: a
#     full-repo baseline run today surfaces ~73 pre-existing issues (mostly
#     errcheck on defer'd Close()/test helpers and a few `unused` test
#     helpers) that are out of scope for a CI-gates task to silently fix
#     inline; gating only new issues (GitHub-API PR/push diff) lands the
#     linter without a giant unrelated cleanup PR. A follow-up WS can burn
#     down the backlog and flip this to ungated.
#   - `proto-pin` now passes `--verify-vendor` instead of `--no-proto-check`
#     to check-proto-pin.sh, so a stale/hand-edited vendor/lexa-proto tree
#     fails the job, not just a proto.pin SHA mismatch (closes the gap in
#     that script's own header comment: "(a) can pass with a stale vendor
#     tree"). AS WRITTEN AT THE TIME THIS BULLET WAS FIRST ADDED it was a
#     no-op: --verify-vendor needs a local lexa-proto checkout to
#     regenerate-and-diff against, and no hosted runner had one, so the
#     script's own graceful-degrade path ("no local lexa-proto checkout --
#     skipping") ran silently instead — see FINDING 3 below (2026-08-17):
#     that gap is now closed, the peer clone steps make --verify-vendor
#     actually run on hosted runners.
#
# 2026-08-17: `proto-pin` retargeted from lexa-hub (ABANDONED 2026-08-03,
# product decision: single-product focus on lexa-gw — see
# scripts/check-proto-pin.sh's NOTE 2026-08-03) to lexa-gw, and made
# non-vacuous:
#   - The second checkout is now `dsizzle83/lexa-gw` (path `lexa-gw`), via a
#     NEW fine-grained PAT secret, `LEXA_GW_RO_TOKEN` (same shape as the old
#     LEXA_HUB_RO_TOKEN above: read-only, Contents-only, restricted to
#     dsizzle83/lexa-gw, expiry set at creation) — this secret does not exist
#     yet and must be created by the repo owner before this job can pass its
#     checkout step; until then it fails there, not on an actual pin
#     mismatch. LEXA_HUB_RO_TOKEN can be retired once this is confirmed
#     working (left alone here, not this task's job).
#   - The check step passes `--product lexa-gw` (was `--product lexa-hub`)
#     and now also `--require-peer`: check-proto-pin.sh's --product default
#     already pointed at ../lexa-gw and a missing peer was only an
#     informational skip (2026-08-03 note in that script), which made THIS
#     job — the one that always passes --product explicitly — green by
#     vacuity if the checkout step above ever silently produced an empty
#     directory. --require-peer turns that specific case into a real
#     failure; see the script's own 2026-08-17 note for the full rationale.
#   - A second check step now runs scripts/check-platform-pin.sh
#     --self . --product lexa-gw --require-peer --verify-vendor, the
#     platform.pin analogue of the proto.pin check above (same script-header
#     rationale: nothing checked platform.pin against the peer before this,
#     even though csip-tls-test commits its own platform.pin and vendors
#     lexa-platform exactly like it does lexa-proto). See that script's
#     header for a documented real mismatch this closes the vacuity gap on:
#     as of this writing csip-tls-test pins lexa-platform @ 71bb2d5 and
#     lexa-gw pins @ 0a61b0d (71bb2d5's immediate parent) — genuine drift,
#     not a mismatch this task introduced or fixed.
#
# 2026-08-17 (second wave, adversarial pin-gate review): three more HIGH
# findings against the wave above, all in the `proto-pin` job:
#   - FINDING 2: the lexa-gw peer checkout pinned no `ref:`, so it always
#     resolved to lexa-gw's default branch (main) — the gate compared THIS
#     repo's pins against lexa-gw@main regardless of which lexa-gw branch/SHA
#     was actually under review. Fixed: the checkout now takes
#     `ref: ${{ vars.LEXA_GW_PIN_REF || 'main' }}`, plus a log step that
#     prints the resolved peer HEAD so a wrong-ref comparison is at least
#     diagnosable. OWNER ACTION: set repository variable
#     `LEXA_GW_PIN_REF=remediation/rc0-failsafe-core` for the duration of
#     this remediation (Settings > Secrets and variables > Actions >
#     Variables); reset to `main`/delete once that branch merges.
#   - FINDING 3: --verify-vendor was unreachable on every hosted run (see the
#     WS-7 bullet above, now corrected) — the step names claimed vendor
#     verification while the script's own no-checkout skip path is what
#     always actually ran. Fixed the same way lexa-gw's own ci.yml
#     `pin-check` job (~lines 352-419 there) already does it: authenticated
#     PAT clones of lexa-proto and lexa-platform into the sibling paths
#     (../lexa-proto, ../lexa-platform) the scripts already default to.
#     OWNER ACTION (new secret): create repository secret
#     `LEXA_PIN_VERIFY_TOKEN` — a fine-grained PAT, read-only Contents,
#     scoped to dsizzle83/lexa-proto and dsizzle83/lexa-platform. The exact
#     same token lexa-gw's repo already uses under that name for its own
#     `pin-check` job works unchanged here; it just needs adding as a secret
#     under THIS repo's Settings too (Actions secrets don't cross repos even
#     under one owner). Job fails loud at a dedicated check step if unset,
#     rather than silently skipping verification.
#   - FINDING 5: the proto-pin job had no `actions/setup-go` step at all,
#     even though --verify-vendor runs `go mod vendor`. Added, matching the
#     other jobs' `go-version-file: go.mod` / `cache: true`.
#
# FINDING 7 (2026-08-17, same review, hygiene + one more HIGH-adjacent item):
#   (a) scripts/check-proto-pin.sh and scripts/check-platform-pin.sh's
#       prefix-equality fallback (used only when no local checkout is
#       available to resolve abbreviated SHAs) now explicitly refuses to
#       treat two full 40-hex SHAs as a possible prefix match — only
#       eligible when at least one side is a genuinely short pin — and logs
#       which resolution mode decided the result.
#   (b) `remediation/**` added to the `push:` branch list above (a
#       remediation branch pushed to directly, with no PR against main, never
#       triggered this workflow before).
#   (c) the dead `n=$(wc -l ...)` in check-proto-pin.sh's read_pin() removed
#       (unused; nonblank-line count already does the real validation).

on:
  pull_request:
  push:
    # FINDING 7 (2026-08-17, adversarial pin-gate review): `remediation/**`
    # added so pushes to a remediation branch (not just PRs targeting main)
    # run CI directly -- pin-gate fixes have been landing and getting
    # verified on remediation/* branches without ever opening a PR against
    # main, which meant `push:` alone never triggered a run on them.
    branches: [main, remediation/**, qa/**]
  schedule:
    - cron: '17 4 * * *' # nightly vuln scan (UTC); see `vulncheck` job below

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TASK-019 committed a go.work (`use (. ../lexa-proto)`) for local dev against
# the in-progress shared module, with GOWORK=off set here because hosted
# runners never have a `../lexa-proto` sibling. TASK-024 removes go.work from
# version control (AD-003(d)/(e)): the build now goes through the committed
# `require lexa-proto v0.0.0` + `replace lexa-proto => ../lexa-proto` +
# vendor/lexa-proto/ in go.mod, which Go auto-selects (`-mod=vendor`) whenever
# vendor/modules.txt is present and consistent — no GOWORK setting needed for
# that to work, and none exists to turn off since the file isn't committed.
# Developers may still keep an untracked local go.work (gitignored) for
# cross-repo dev against a live ../lexa-proto checkout; it never reaches CI.
jobs:
  pure-go:
    name: pure-go
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # REV0907-H12: an unbounded job hangs a runner (and this branch's CI
    # queue behind it) instead of failing loud; bounded to comfortably
    # exceed this job's normal run time.
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt -l (tracked, non-vendor .go files)
        # vendor/ excluded deliberately -- see the WS-7 note above `on:`.
        run: |
          UNFMT="$(git ls-files '*.go' | grep -v '^vendor/' | xargs gofmt -l)"
          if [[ -n "$UNFMT" ]]; then
            echo "gofmt -l found unformatted file(s):" >&2
            echo "$UNFMT" >&2
            echo >&2
            echo "Fix locally: gofmt -w \$(git ls-files '*.go' | grep -v '^vendor/')" >&2
            exit 1
          fi
          echo "gofmt: all tracked non-vendor .go files are formatted."

      # WP7-T10 landed internal/wolfssl's CGO_ENABLED=0 stub (wolfssl_nocgo.go)
      # for the base API, not just the keylog extras — before that, this step
      # had to enumerate the pure-Go package set by hand (internal/mbtls,
      # internal/tlsclient, sim/tlsserver, and everything importing them, e.g.
      # cmd/certify, failed to typecheck under CGO_ENABLED=0 with "undefined:
      # wolfssl.NewClientCtxTLS" and friends). Verified locally (2026-09-08):
      # `CGO_ENABLED=0 go build ./...` now succeeds whole-module.
      - name: Build every pure-Go-buildable binary (whole module, CGO_ENABLED=0)
        run: go build ./...

      - name: Vet (whole module, CGO_ENABLED=0 — see the build step above)
        run: go vet ./...

      # WP7-T1 (REV0907-E1/H8/E10): internal/csipref's own referee unit tests
      # (walker/scheduler + TASK-048 fuzz seeds) and the ./tests/ conformance
      # suite that used to run here are BOTH built on internal/csipref,
      # internal/httpclient and internal/tlsclient — none of which
      # cmd/certify or cmd/gw-campaign (the certify live set, see the
      # CERTIFY_LIVE_SET comment in the Makefile) can import. This job's
      # -race budget now goes to the referee/cgo-fast jobs' actual coverage
      # of the live set instead. internal/csipref is a deliberately
      # independent walker (AD-003(f)), not deleted — its tests still run by
      # hand (`go test ./internal/csipref/...`); they are simply no longer a
      # standing per-PR CI gate, since a green run there was never evidence
      # that cmd/certify's own oracles work. `go test ./tests/ -run
      # TestModbusConformance -v` (Makefile's `test-southbound`) covers the
      # one slice of ./tests/ that does touch a live-set package
      # (sim/southbound) and was not wired into ci.yml before this change
      # either — it stays a local/manual gate, not newly regressed by this
      # edit (KNOWN GAP, not this task's scope to close).
      #
      # internal/southbound/... (a DIFFERENT package from sim/southbound —
      # the Modbus device-driver stack sim/modsim-client uses) is not part of
      # CERTIFY_LIVE_SET either, but its own step below is left in place: it
      # is real, referenced coverage (TASK-053's int16/scale-factor sweep,
      # internal/southbound/sunspecsweep) with no other CI gate exercising
      # it, unlike csipref/tests/, so removing it would be a silent coverage
      # loss this task was not asked to make.
      - name: Southbound unit tests
        env:
          CGO_ENABLED: "1" # -race needs cgo (gcc, not wolfSSL) — WS-7, see note above `on:`
        run: go test -race ./internal/southbound/...

      # TASK-053: the generative int16/scale-factor boundary sweep (GAP-07)
      # needs no new step here — it lands as ordinary _test.go files in
      # packages already exercised above/below: "Southbound unit tests"
      # (internal/southbound/sunspecsweep runs the shared lexa-proto/sunspec
      # codec contract against this repo's vendored copy) and this step's
      # `scripts/qa-regression.sh`, which already globs ./sim/gridsim/...
      # (apFromWatts' encode-scaling sweep, this repo's product-analogous
      # watt encoder). Verified locally: both pick up the new tests without
      # modification.
      - name: QA-harness unit gate (scripts/qa-regression.sh)
        env:
          CGO_ENABLED: "1" # -race needs cgo — WS-7; the script's own go test now passes -race (cmd/dashboard is concurrency-heavy)
        run: bash scripts/qa-regression.sh

  cgo-fast:
    name: cgo-fast
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # REV0907-H12: bounded so a hung wolfSSL build/link or a stuck lint pass
    # fails loud instead of hanging the runner; a cache miss (full wolfSSL
    # build) is the slow path this job budgets for.
    timeout-minutes: 60
    env:
      WOLFSSL_VERSION: "5.7.6-stable"
      WOLFSSL_SYSROOT: /home/runner/wolfssl-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache wolfSSL ${{ env.WOLFSSL_VERSION }} sysroot
        id: cache-wolfssl
        uses: actions/cache@v4
        with:
          path: ${{ env.WOLFSSL_SYSROOT }}
          key: wolfssl-${{ env.WOLFSSL_VERSION }}-${{ runner.os }}-v4

      - name: Install wolfSSL build toolchain
        if: steps.cache-wolfssl.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc cmake automake autoconf libtool

      - name: Build + install wolfSSL ${{ env.WOLFSSL_VERSION }} (cache miss only)
        if: steps.cache-wolfssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd /tmp
          wget -q "https://github.com/wolfSSL/wolfssl/archive/refs/tags/v${WOLFSSL_VERSION}.tar.gz" \
            -O wolfssl.tar.gz
          tar xzf wolfssl.tar.gz
          cd "wolfssl-${WOLFSSL_VERSION}"
          autoreconf -i
          mkdir -p /tmp/wolfssl-build
          cd /tmp/wolfssl-build
          "/tmp/wolfssl-${WOLFSSL_VERSION}/configure" \
            --prefix="$WOLFSSL_SYSROOT" \
            --enable-tls13 --enable-aesccm --enable-tlsx \
            --enable-certgen --enable-opensslall \
            --enable-maxfragment --enable-secure-renegotiation \
            --enable-session-ticket --enable-cryptocb \
            --enable-sessioncerts \
            --enable-static --disable-shared \
            --disable-examples --disable-crypttests \
            --enable-reproducible-build
          make -j"$(nproc)"
          make install prefix="$WOLFSSL_SYSROOT"

      - name: "Export cgo flags (static libwolfssl.a needs -lm: pow/log in dh.c)"
        run: |
          echo "CGO_CFLAGS=-I${WOLFSSL_SYSROOT}/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${WOLFSSL_SYSROOT}/lib -lm" >> "$GITHUB_ENV"

      - name: golangci-lint (basic preset, new issues only — WS-7, see note above `on:`)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          only-new-issues: true

      - name: generate gitignored test certs (sim/tlsserver + internal/tlsclient testdata)
        run: make gen-test-certs

      - name: make test-fast (cgo compiles; TLS-handshake tests inside stay integration-tagged)
        run: make test-fast WOLFSSL_SYSROOT="$WOLFSSL_SYSROOT"

      # WP7-T1 (REV0907-E1/H8/E10): the cgo half of the certify referee gate.
      # `make test-certify` covers CERTIFY_LIVE_SET_SELFTEST (see Makefile) —
      # every package cmd/certify or cmd/gw-campaign can import, minus
      # internal/mbtls and internal/tlsprobe — plus the CGO_ENABLED=0 build,
      # the keylog configuration build (skipped here: this job's sysroot is
      # the ordinary one, not WOLFSSL_KEYLOG_SYSROOT), the loopback
      # acceptance test, and its own live-set-check (Makefile target) so a
      # drifted CERTIFY_LIVE_SET fails THIS job, not just a local run.
      # internal/mbtls/internal/tlsprobe run right after with their own
      # -race pass: a -race unit pass over their pure-Go call sites proves
      # nothing about whether they still complete a real wolfSSL handshake,
      # so they get the real cgo build this job already carries the sysroot
      # for, same as make test-fast above — the referee `nocgo` job (a
      # CGO_ENABLED=0 job) cannot run either package at all (undefined
      # wolfssl.* symbols without cgo). Together this step and the referee
      # job's nocgo step cover CERTIFY_LIVE_SET exactly (make live-set-check
      # is the standing proof of that, not a one-time claim).
      - name: make test-certify (referee live set, cgo half)
        run: make test-certify WOLFSSL_SYSROOT="$WOLFSSL_SYSROOT"

      - name: tlsprobe + mbtls -race (real wolfSSL handshakes; live-set members test-certify does not cover)
        run: go test -race ./internal/tlsprobe/... ./internal/mbtls/...

      - name: Build cgo binaries (sim/server, sim/client, sim/conformance)
        run: go build ./sim/server ./sim/client ./sim/conformance

  # WP7-T1 (REV0907-E1/H8/E10): the nocgo half of the certify referee gate —
  # see the CERTIFY_LIVE_SET comment in the Makefile for the "CI never ran
  # this" background. This job runs the four live-set package trees that are
  # genuinely CGO_ENABLED=0-clean (`make test-certify`'s own
  # `CGO_ENABLED=0 go build/test ./cmd/certify` step already proved that for
  # cmd/certify specifically): internal/certify/... (the oracle suites),
  # internal/evidence/... (the bundle writer/verifier), internal/invariant
  # (the ten-invariant campaign predicates) and cmd/certify/... itself.
  # internal/mbtls, internal/tlsprobe, internal/wolfssl and everything that
  # imports them (cmd/gw-campaign, internal/aggregator, internal/campaign,
  # sim/gw-mayhem/gwloopback, sim/southbound) need a real wolfSSL sysroot to
  # mean anything and cannot even build under CGO_ENABLED=0 (undefined
  # wolfssl.* symbols) — the cgo-fast job's `make test-certify` +
  # `go test -race ./internal/tlsprobe/... ./internal/mbtls/...` steps cover
  # those. Together the two cover CERTIFY_LIVE_SET exactly; `make
  # live-set-check` (run at the end of `make test-certify` in cgo-fast) is
  # the standing proof that stays true as the live set changes.
  #
  # No -race here deliberately: -race needs cgo (a plain C compiler), which
  # would defeat the point of this job proving the CGO_ENABLED=0 configuration
  # actually works — the cgo-fast job above already runs -race over the same
  # internal/certify/... + cmd/certify/... trees (plus the rest of the live
  # set) with a real C compiler present.
  referee:
    name: referee (nocgo)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # Measured locally (2026-09-08, desktop): ~1m20s end to end (the
    # internal/certify/suitecsip and suitemodbusserver oracle suites are the
    # slow packages, ~45s each). Bounded generously above a cold hosted
    # runner's module-download + compile overhead so a genuine hang fails
    # loud instead of tying up the runner.
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: certify live set (nocgo half) — internal/certify, internal/evidence, internal/invariant, cmd/certify
        run: go test -count=1 ./internal/certify/... ./internal/evidence/... ./internal/invariant/... ./cmd/certify/...

  # TASK-005: pinned govulncheck (scripts/ci/govulncheck.sh) + triage
  # allowlist (scripts/ci/vuln-allowlist.txt). Reuses the cgo-fast wolfSSL
  # cache/build steps — govulncheck must build the whole module (cgo
  # packages included) or it silently scans a shrunken package set. Gates
  # only on REACHABLE findings (real call path, not merely imported or
  # transitively required); everything else is informational. Runs on PR,
  # push:main, and the nightly cron (new CVEs land with no code change).
  # Required (blocking) as of TASK-006 — the dependency refresh cleared the
  # baseline to 0 Called findings; see docs/refactor/VULN_BASELINE_2026-07-04.md.
  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    # REV0907-H12: bounded so a hung wolfSSL build/link or a stuck scan fails
    # loud instead of hanging the runner (this job also runs unattended on
    # the nightly cron, where there is no PR waiting on it to notice a hang).
    timeout-minutes: 30
    env:
      WOLFSSL_VERSION: "5.7.6-stable"
      WOLFSSL_SYSROOT: /home/runner/wolfssl-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache wolfSSL ${{ env.WOLFSSL_VERSION }} sysroot
        id: cache-wolfssl
        uses: actions/cache@v4
        with:
          path: ${{ env.WOLFSSL_SYSROOT }}
          key: wolfssl-${{ env.WOLFSSL_VERSION }}-${{ runner.os }}-v4

      - name: Install wolfSSL build toolchain
        if: steps.cache-wolfssl.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc cmake automake autoconf libtool

      - name: Build + install wolfSSL ${{ env.WOLFSSL_VERSION }} (cache miss only)
        if: steps.cache-wolfssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd /tmp
          wget -q "https://github.com/wolfSSL/wolfssl/archive/refs/tags/v${WOLFSSL_VERSION}.tar.gz" \
            -O wolfssl.tar.gz
          tar xzf wolfssl.tar.gz
          cd "wolfssl-${WOLFSSL_VERSION}"
          autoreconf -i
          mkdir -p /tmp/wolfssl-build
          cd /tmp/wolfssl-build
          "/tmp/wolfssl-${WOLFSSL_VERSION}/configure" \
            --prefix="$WOLFSSL_SYSROOT" \
            --enable-tls13 --enable-aesccm --enable-tlsx \
            --enable-certgen --enable-opensslall \
            --enable-maxfragment --enable-secure-renegotiation \
            --enable-session-ticket --enable-cryptocb \
            --enable-sessioncerts \
            --enable-static --disable-shared \
            --disable-examples --disable-crypttests \
            --enable-reproducible-build
          make -j"$(nproc)"
          make install prefix="$WOLFSSL_SYSROOT"

      - name: "Export cgo flags (static libwolfssl.a needs -lm: pow/log in dh.c)"
        run: |
          echo "CGO_CFLAGS=-I${WOLFSSL_SYSROOT}/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${WOLFSSL_SYSROOT}/lib -lm" >> "$GITHUB_ENV"

      - name: govulncheck (pinned, reachable-findings gate)
        run: |
          set -o pipefail
          bash scripts/ci/govulncheck.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # TASK-024: shared-module version-pin gate (AD-003(c)), replaces TASK-004's
  # report-only lockstep-divergence job. See the header comment above `on:`
  # for the PAT/secret rationale and scripts/check-proto-pin.sh for the full
  # mechanics.
  proto-pin:
    name: proto-pin
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # REV0907-H12: bounded so a stuck sibling-repo clone or vendor
    # regeneration fails loud instead of hanging the runner.
    timeout-minutes: 30
    steps:
      - name: Checkout csip-tls-test (bench, this repo)
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        # FINDING 5 (2026-08-17): this job had no Go toolchain at all, even
        # though --verify-vendor below runs `go mod vendor` -- it could only
        # ever have hit the script's own "no go toolchain" style failure once
        # a real vendor regeneration was reachable (see FINDING 3). Matches
        # the pure-go/cgo-fast/vulncheck jobs' Go version above.
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout lexa-gw (product) read-only, at the pinned review ref
        # FINDING 2 (2026-08-17): this checkout previously pinned no ref, so
        # it always resolved to lexa-gw's default branch (main) regardless of
        # which lexa-gw branch/SHA was actually under review -- the gate
        # compared THIS repo's pins against lexa-gw@main forever, even on a
        # PR meant to validate against a specific lexa-gw remediation branch.
        # scripts/check-proto-pin.sh / check-platform-pin.sh read the peer's
        # proto.pin/platform.pin from whatever this checkout's HEAD is, so
        # the ref landed here IS the peer side of the comparison.
        #
        # Fix: pin the checkout to the `LEXA_GW_PIN_REF` repository variable,
        # falling back to `main` when it is unset (keeps today's default
        # behavior for normal operation). OWNER ACTION: set the repository
        # variable LEXA_GW_PIN_REF to the release/remediation branch under
        # test (currently remediation/rc0-failsafe-core) for the duration of
        # this remediation -- Settings > Secrets and variables > Actions >
        # Variables > New repository variable. Reset it to `main` (or delete
        # it) once that branch has merged.
        uses: actions/checkout@v4
        with:
          repository: dsizzle83/lexa-gw
          token: ${{ secrets.LEXA_GW_RO_TOKEN }}
          path: lexa-gw
          ref: ${{ vars.LEXA_GW_PIN_REF || 'main' }}

      - name: log resolved lexa-gw peer ref + HEAD (diagnose a wrong-ref comparison)
        # FINDING 2, continued: pinning the ref removes the silent-main
        # failure mode, but a wrong LEXA_GW_PIN_REF (typo, stale branch name)
        # is still possible -- print what was actually requested and what it
        # actually resolved to so a bad comparison is at least diagnosable
        # from the job log instead of silently comparing the wrong lexa-gw
        # state.
        run: |
          echo "proto-pin: LEXA_GW_PIN_REF = '${{ vars.LEXA_GW_PIN_REF || '(unset, defaulted to main)' }}'"
          echo "proto-pin: lexa-gw peer checkout resolved HEAD = $(git -C lexa-gw rev-parse HEAD)"
          git -C lexa-gw log -1 --oneline

      # FINDING 3 (2026-08-17): --verify-vendor below has been unreachable on
      # every hosted run since it was added -- no hosted runner has a local
      # lexa-proto or lexa-platform checkout (neither module is hosted with
      # an ordinary fetchable remote), so check-proto-pin.sh's own graceful
      # degrade path ("no local lexa-proto checkout -- skipping") is what
      # actually ran every time, silently, while the step name ("... + vendor
      # content verify") claimed verification happened. lexa-gw's own
      # .github/workflows/ci.yml `pin-check` job (~lines 352-419) already
      # solves this exact shape: clone both private modules directly with an
      # authenticated PAT clone (not a hosted "remote fetch") into the sibling
      # layout the scripts default to (../lexa-proto, ../lexa-platform
      # relative to $GITHUB_WORKSPACE, i.e. --self's parent). Ported here
      # verbatim (same clone_pinned shape, same auth pattern) so
      # --verify-vendor actually runs instead of quietly no-op'ing.
      - name: require sibling-repo access token (lexa-proto, lexa-platform)
        # The secrets context is not available in step `if:` conditionals, so
        # the emptiness check lives in bash (same pattern lexa-gw's ci.yml
        # uses for the equivalent check).
        env:
          PIN_VERIFY_TOKEN: ${{ secrets.LEXA_PIN_VERIFY_TOKEN }}
        run: |
          if [ -z "$PIN_VERIFY_TOKEN" ]; then
            echo "::error::proto-pin needs read access to the private dsizzle83/lexa-proto and dsizzle83/lexa-platform repos to actually run --verify-vendor (FINDING 3), and the LEXA_PIN_VERIFY_TOKEN repository secret is not set."
            echo "::error::OWNER ACTION: create a fine-grained PAT scoped to read-only Contents on dsizzle83/lexa-proto and dsizzle83/lexa-platform (or a classic PAT with repo scope on both -- the SAME token lexa-gw's own ci.yml already uses as LEXA_PIN_VERIFY_TOKEN works unchanged here, it only needs adding as a secret under THIS repo's Settings too, since Actions secrets do not cross repos even under one owner), then add it as the LEXA_PIN_VERIFY_TOKEN secret under this repo's Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: clone pinned lexa-proto + lexa-platform (read-only, siblings of the checkout)
        # Clone both pinned repos as siblings of the csip-tls-test checkout
        # (../lexa-proto, ../lexa-platform relative to $GITHUB_WORKSPACE) --
        # the exact layout scripts/check-proto-pin.sh's --proto and
        # scripts/check-platform-pin.sh's --checkout already default to
        # (relative to --self, passed as "." below), so no override flag is
        # needed on the check steps. Same clone-then-checkout-pin shape as
        # lexa-gw's own ci.yml pin-check job; auth follows the same
        # http.extraheader pattern actions/checkout itself uses (bearer
        # credential via git config, never embedded in a printable/loggable
        # URL).
        env:
          PIN_VERIFY_TOKEN: ${{ secrets.LEXA_PIN_VERIFY_TOKEN }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$PIN_VERIFY_TOKEN" | base64 -w0)"
          clone_pinned() {
            local repo="$1" pin_file="$2" dest="$3" sha
            sha="$(tr -d '[:space:]' < "$pin_file")"
            git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
              clone --filter=blob:none "https://github.com/dsizzle83/${repo}.git" "$dest"
            # Blobless clone => `checkout <pinned sha>` lazy-fetches any blob
            # not on the default branch HEAD from the promisor remote. A `-c`
            # on the clone command alone does not persist, so once the
            # sibling's HEAD advances past the pin that lazy fetch would run
            # unauthenticated and die -- persist the header in the clone's
            # local config so every later fetch in this tree is authed too.
            git -C "$dest" config http.extraheader "AUTHORIZATION: basic ${AUTH_HEADER}"
            git -C "$dest" checkout --quiet "$sha"
          }
          clone_pinned lexa-proto    proto.pin    ../lexa-proto
          clone_pinned lexa-platform platform.pin ../lexa-platform

      - name: proto.pin version-pin check + vendor content verify (fails on mismatch — no allowlist)
        # --verify-vendor is now LIVE (FINDING 3): ../lexa-proto and
        # ../lexa-platform are real clones checked out at their respective
        # pins (previous step), so check-proto-pin.sh's (b)/(c) checks run
        # for real instead of degrading to the "no local checkout" skip.
        # --require-peer (2026-08-17, prior wave) turns a missing/empty
        # lexa-gw checkout above into a hard failure instead of the
        # informational skip the script defaults to for local/dev use.
        run: bash scripts/check-proto-pin.sh --self . --product lexa-gw --require-peer --verify-vendor

      - name: platform.pin version-pin check + vendor content verify (fails on mismatch — no allowlist)
        # Platform.pin analogue of the proto.pin step above. --verify-vendor
        # is now LIVE for the same reason (FINDING 3).
        run: bash scripts/check-platform-pin.sh --self . --product lexa-gw --require-peer --verify-vendor

  # TASK-048 originally pointed this job at the client-side IEEE 2030.5 XML
  # unmarshal entry points in internal/csipref/discovery — this repo's own
  # (deliberately independent, AD-003(f)) walker's decode step. WP7-T1
  # (REV0907-E1/H8/E10) retargets it: internal/csipref is not part of
  # CERTIFY_LIVE_SET (cmd/certify and cmd/gw-campaign cannot import it — see
  # the Makefile comment), so 30 minutes of nightly fuzz budget there proved
  # nothing about the thing this repo ships as a conformance tool.
  # `grep -rn '^func Fuzz'` intersected with CERTIFY_LIVE_SET finds exactly
  # two live-set packages carrying a go-native fuzz target: internal/mbapref
  # (the differential MBAP reader, 3 targets) and internal/evidence/pcapng
  # (FuzzReader, the pcap/pcapng reader's no-panic-on-malformed-input
  # guarantee) — same targets as the Makefile's `fuzz` target now runs, kept
  # written out explicitly here (rather than `run: make fuzz`) so each
  # target's own output still streams to $GITHUB_STEP_SUMMARY the way the
  # csipref version did. Same job shape otherwise as lexa-hub's TASK-047
  # httpwire fuzz job and this repo's own `vulncheck` job above: nightly-only
  # (`if: github.event_name == 'schedule'`, same cron as vulncheck), no cgo
  # needed (both packages import nothing beyond stdlib — unlike cgo-fast
  # above, this never touches wolfSSL). A crasher found here writes a
  # regression file under <pkg>/testdata/fuzz/<FuzzName>/, which every
  # subsequent `go test` (no -fuzz) reruns as a normal test case; the
  # artifact upload is a convenience for grabbing that file out of a run
  # nobody was watching live. csipref's own fuzz targets are untouched and
  # still runnable by hand (`go test -fuzz=... ./internal/csipref/discovery/`);
  # they are simply no longer this job's concern.
  fuzz:
    name: fuzz (nightly, certify live-set targets)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    # REV0907-H12, updated for WP7-T1: this job now budgets FOUR 15m fuzz
    # targets (60m) plus setup, versus the original two (30m) — bounded
    # generously above that (same ~3x headroom the original 90m/30m budgeted)
    # so a genuinely hung fuzz run fails loud on an unattended nightly instead
    # of tying up a runner indefinitely.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: fuzz internal/mbapref (differential MBAP reader, 15m/target, no cgo)
        run: |
          set -o pipefail
          go test -fuzz=FuzzMBAPDifferential -fuzztime=15m ./internal/mbapref/ 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          go test -fuzz=FuzzMBAPExchange     -fuzztime=15m ./internal/mbapref/ 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          go test -fuzz=FuzzMBAPRoundTrip    -fuzztime=15m ./internal/mbapref/ 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: fuzz internal/evidence/pcapng (FuzzReader, 15m, no cgo)
        run: |
          set -o pipefail
          go test -fuzz=FuzzReader -fuzztime=15m ./internal/evidence/pcapng/ 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: upload crashers (only present on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certify-live-set-fuzz-crashers
          path: |
            internal/mbapref/testdata/fuzz/*/
            internal/evidence/pcapng/testdata/fuzz/*/
          if-no-files-found: ignore
